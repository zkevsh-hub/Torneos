<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zKevsh - Tournament Bracket</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap');

    :root {
      --neon-white: #ffffff;
      --neon-gray: #a0a0a0;
      --neon-black: #0a0a0a;
      --dark-bg: #111111;
      --darker-bg: #000;
      --card-bg: #0d0d0d;
      --tier-1: #e0e0e0;
      --tier-2: #cccccc;
      --tier-3: #b3b3b3;
      --tier-4: #999999;
      --tier-5: #808080;
      --tier-6: #666666;
      --tier-7: #4d4d4d;
      --tier-8: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(ellipse at center, var(--dark-bg) 0%, var(--darker-bg) 70%);
      color: #fff;
      margin: 0;
      padding: 20px;
      text-align: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    header {
      margin-bottom: 30px;
      position: relative;
      padding: 20px;
    }

    h1 {
      font-size: 3.5rem;
      background: linear-gradient(45deg, var(--neon-white), var(--neon-gray), #555);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
      letter-spacing: 5px;
      font-weight: 900;
      text-shadow: 
        0 0 10px rgba(255,255,255,0.5),
        0 0 20px rgba(255,255,255,0.2);
      animation: pulsate 2s infinite alternate;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
      padding: 25px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 15px;
      border: 1px solid var(--neon-white);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
    }

    label {
      margin-bottom: 8px;
      color: var(--neon-white);
      font-weight: bold;
      text-shadow: 0 0 5px rgba(255,255,255,0.5);
    }

    textarea, select, input {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      border: 1px solid var(--neon-white);
      border-radius: 10px;
      outline: none;
      font-family: 'Orbitron', sans-serif;
      transition: all 0.3s ease;
    }

    textarea:focus, select:focus, input:focus {
      box-shadow: 0 0 15px var(--neon-white);
      transform: translateY(-2px);
    }

    button {
      padding: 12px 24px;
      background: transparent;
      border: 2px solid var(--neon-white);
      color: var(--neon-white);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      letter-spacing: 2px;
    }

    button:hover {
      background: var(--neon-white);
      color: #000;
      box-shadow: 0 0 20px var(--neon-white);
    }

    button.danger {
      border-color: #444;
      color: #888;
    }

    button.danger:hover {
      background: #444;
      color: white;
    }

    .round-title {
      color: var(--neon-white);
      font-size: 1.5rem;
      margin-bottom: 30px;
      text-shadow: 0 0 10px var(--neon-white);
      text-transform: uppercase;
    }

    .match {
      padding: 15px;
      border: 1px solid var(--neon-white);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      width: 220px;
      min-height: 120px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      position: relative;
      transition: all 0.3s ease;
      z-index: 2;
    }

    .match:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 20px var(--neon-white);
    }

    .match-number {
      position: absolute;
      top: -12px;
      left: 10px;
      background: black;
      padding: 0 8px;
      font-size: 0.8rem;
      color: var(--neon-white);
      border: 1px solid var(--neon-white);
    }

    .winner-btn {
      margin-top: 10px;
      padding: 5px 10px;
      font-size: 0.7rem;
    }

    .connectors {
      position: absolute;
      width: 30px;
      height: 2px;
      background: var(--neon-white);
      top: 50%;
      right: -30px;
    }

    .connectors::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 102px;
      background: var(--neon-white);
      top: -50px;
      right: 0;
    }

    /* Tiers en Blanco/Gris */
    .player-tier {
      display: inline-block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin-right: 8px;
      text-align: center;
      line-height: 20px;
      font-size: 10px;
      font-weight: bold;
      color: black;
      background: white;
    }

    .champion-container {
      margin-top: 40px;
      padding: 30px;
      background: white;
      color: black;
      border-radius: 15px;
      box-shadow: 0 0 50px white;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      display: none;
    }

    @keyframes pulsate {
      0% { opacity: 0.8; }
      100% { opacity: 1; text-shadow: 0 0 20px white; }
    }

    .particle {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.3;
      animation: float 10s infinite linear;
    }

    @keyframes float {
      from { transform: translateY(100vh); }
      to { transform: translateY(-10vh); }
    }
  </style>
</head>
<body>
  <div id="particles"></div>
  
  <div class="container">
    <header>
      <h1 id="main-title">zKevsh</h1>
    </header>

    <div class="controls">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <label>Jugadores (Nombre:Tier):</label>
        <textarea id="jugadores" placeholder="Nombre:8"></textarea>
      </div>
      
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <label>Formato:</label>
        <select id="formato">
          <option value="1">1v1</option>
          <option value="2">2v2</option>
          <option value="4">4v4</option>
        </select>
        
        <label>Torneo:</label>
        <input type="text" id="torneo" placeholder="Nombre del torneo">
      </div>

      <div class="buttons">
        <button id="generarBtn">Generar</button>
        <button id="limpiarBtn" class="danger">Limpiar</button>
      </div>
    </div>

    <div id="bracket" style="display:flex; justify-content:center; gap:50px; padding:40px; overflow-x:auto;"></div>

    <div id="champion" class="champion-container">
      <h2>🏆 CAMPEÓN 🏆</h2>
      <h1 id="champion-name" style="color:black; background:none; -webkit-background-clip: initial; text-shadow:none;"></h1>
    </div>
  </div>

  <script>
    let rondas = [];

    document.getElementById("generarBtn").onclick = function() {
      const input = document.getElementById("jugadores").value.trim();
      const tName = document.getElementById("torneo").value;
      if(!input) return alert("Ingresa jugadores");

      if(tName) document.getElementById("main-title").innerText = tName;

      let jugadores = input.split("\n").map(l => {
        let [n, t] = l.split(":");
        return { nombre: n, tier: t || 1 };
      });

      // Mezclar y Crear Rondas
      jugadores = jugadores.sort(() => Math.random() - 0.5);
      rondas = [chunk(jugadores, parseInt(document.getElementById("formato").value))];
      
      let numRondas = Math.ceil(Math.log2(rondas[0].length));
      for(let i=1; i<=numRondas; i++) {
        rondas[i] = new Array(Math.ceil(rondas[i-1].length/2)).fill(null);
      }
      dibujar();
    };

    function chunk(arr, size) {
      return Array.from({ length: Math.ceil(arr.length / size) }, (v, i) =>
        arr.slice(i * size, i * size + size)
      );
    }

    function dibujar() {
      const b = document.getElementById("bracket");
      b.innerHTML = "";
      document.getElementById("champion").style.display = "none";

      rondas.forEach((ronda, rIdx) => {
        const rDiv = document.createElement("div");
        rDiv.style.display = "flex";
        rDiv.style.flexDirection = "column";
        rDiv.style.justifyContent = "space-around";
        
        rDiv.innerHTML = `<div class="round-title">R${rIdx+1}</div>`;

        ronda.forEach((equipo, eIdx) => {
          const m = document.createElement("div");
          m.className = "match";
          m.style.marginBottom = "20px";
          
          if(equipo) {
            let nombres = equipo.map(j => `<div><span class="player-tier">${j.tier}</span>${j.nombre}</div>`).join("");
            m.innerHTML = `<div class="match-number">Match</div>${nombres}`;
            
            const btn = document.createElement("button");
            btn.className = "winner-btn";
            btn.innerText = rIdx === rondas.length -1 ? "CAMPEÓN" : "WINNER";
            btn.onclick = () => {
              if(rIdx === rondas.length -1) {
                document.getElementById("champion").style.display = "block";
                document.getElementById("champion-name").innerText = equipo.map(j => j.nombre).join(" & ");
              } else {
                rondas[rIdx+1][Math.floor(eIdx/2)] = equipo;
                dibujar();
              }
            };
            m.appendChild(btn);
          } else {
            m.innerHTML = "TBD";
          }
          rDiv.appendChild(m);
        });
        b.appendChild(rDiv);
      });
    }

    document.getElementById("limpiarBtn").onclick = () => location.reload();

    // Partículas
    for(let i=0; i<30; i++) {
      let p = document.createElement("div");
      p.className = "particle";
      p.style.width = p.style.height = Math.random()*5+"px";
      p.style.left = Math.random()*100+"vw";
      p.style.animationDuration = 5+Math.random()*10+"s";
      document.getElementById("particles").appendChild(p);
    }
  </script>
</body>
</html>
